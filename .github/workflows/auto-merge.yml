name: Auto Merge Workflow

on:
  workflow_run:
    workflows: ["GitHub Actions Workflow", "Basic CI Check"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Get PR info
        id: get_pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            if (!run.pull_requests || run.pull_requests.length === 0) {
              core.setFailed("No PR linked to this workflow_run.");
              return;
            }

            const pr = run.pull_requests[0];
            core.setOutput("number", pr.number);
            core.setOutput("branch", pr.head.ref);

      - name: Validate branch prefix
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "${{ steps.get_pr.outputs.branch }}";
            if (!branch.startsWith("abc/aaa/")) {
              core.setFailed(`Branch '${branch}' does NOT match abc/aaa/ prefix.`);
            }

      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number("${{ steps.get_pr.outputs.number }}");
            const { owner, repo } = context.repo;

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "squash"
            });

            core.info(`Merged PR #${prNumber}`);
