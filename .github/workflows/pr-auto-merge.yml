name: Auto Merge Workflow

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: |
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'abc/aaa/')
    runs-on: ubuntu-latest

    steps:

      - name: Get PR info
        id: pr
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV

      - name: Wait for all required checks to pass
        uses: actions/github-script@v7
        id: checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Get combined status for HEAD commit
            const status = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: pr.head.sha,
            });

            core.info("Combined state: " + status.data.state);

            if (status.data.state !== "success") {
              core.setFailed("Required checks NOT finished or NOT successful.");
            }

      - name: Ensure PR is mergeable
        uses: actions/github-script@v7
        id: mergeable
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.mergeable) {
              core.setFailed("PR not mergeable (conflicts or checks incomplete).");
            } else {
              core.info("PR mergeable. Proceeding...");
            }

      - name: Auto-merge PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: "squash"
            });

            core.info(`✅ Successfully auto-merged PR #${pr.number}`);
