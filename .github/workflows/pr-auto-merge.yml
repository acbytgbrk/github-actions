name: Auto Merge Workflow

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: Auto Merge for Matching Branches
    runs-on: ubuntu-latest

    if: |
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.head.ref, 'abc/aaa/')

    steps:
      - name: Log PR Info
        run: |
          echo "PR #: ${{ github.event.pull_request.number }}"
          echo "Branch: ${{ github.event.pull_request.head.ref }}"

      - name: Wait for PR to become mergeable
        uses: actions/github-script@v7
        id: wait_mergeable
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            let pr;
            let attempts = 10;

            while (attempts-- > 0) {
              pr = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

              const state = pr.data.mergeable_state;
              console.log("Current mergeable_state:", state);

              if (state === "clean") {
                console.log("🟢 PR is mergeable now.");
                return;
              }

              if (state === "dirty") {
                core.setFailed("❌ Merge conflict detected.");
                return;
              }

              console.log("⏳ Waiting for checks to finish...");
              await new Promise(r => setTimeout(r, 5000));
            }

            core.setFailed("❌ Timeout: PR did not reach mergeable state.");

      - name: Auto-merge PR (Squash)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: "squash",
            });
            console.log(`✅ Successfully auto-merged PR #${pr.number}`);
