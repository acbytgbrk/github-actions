name: Auto Merge Workflow

on:
  workflow_run:
    workflows: ["Basic CI Check"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Get PR Info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            if (!run.pull_requests || run.pull_requests.length === 0) {
              core.setFailed("No PR associated with workflow_run");
              return;
            }

            const pr = run.pull_requests[0];
            core.setOutput("number", pr.number);
            core.setOutput("ref", pr.head.ref);
            core.setOutput("base", pr.base.ref);

      - name: Check branch pattern
        id: pattern
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "${{ steps.pr.outputs.ref }}";
            if (!branch.includes("abc/aaa/")) {
              core.setFailed("Branch pattern does not match");
            }

      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const { owner, repo } = context.repo;

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "squash"
            });

            console.log(`Merged PR #${prNumber}`);
